{% extends 'base.html' %}

{% block content %}
  <h2>Edit Level: {{ level.name }}</h2>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save changes</button>
  </form>
  <a href="{% url 'levels:level_detail' level.id %}">Cancel</a>

  <script>
  (function () {
      const input = document.getElementById('id_tags');
      if (!input) return;

      const allTags = [{% for tag_value, tag_label in tag_choices %}{ value: "{{ tag_value|escapejs }}", label: "{{ tag_label|escapejs }}" },{% endfor %}];
      const parseInitialValue = (value) => {
          const trimmed = (value || '').trim();
          if (!trimmed) return [];
          if (trimmed.startsWith('[') && trimmed.endsWith(']')) {
              const matches = trimmed.match(/"([^"]+)"|'([^']+)'/g) || [];
              return matches.map(match => match.slice(1, -1));
          }
          return trimmed
              .split(',')
              .map(tag => tag.trim())
              .filter(Boolean);
      };
      const initialValue = parseInitialValue(input.value);
      if (initialValue.length) {
          input.value = initialValue.join(', ');
      }
      const suggestions = document.createElement('ul');
      suggestions.id = 'tag-suggestions-list';
      suggestions.className = 'list-group mt-2';
      suggestions.style.display = 'none';
      input.parentNode.insertBefore(suggestions, input.nextSibling);

      const normalizeTags = (value) => {
          return value
              .split(',')
              .map(tag => tag.trim())
              .filter(Boolean);
      };

      const formatTags = (value) => normalizeTags(value).join(', ');
      const normalizeToken = (value) => value.toLowerCase().replace(/\s+/g, ' ').trim();
      const toStoredTag = (value) => value.toLowerCase().replace(/\s+/g, '-');

      const renderSuggestions = () => {
          const currentValue = input.value.trim();
          const parts = currentValue.split(',');
          const currentToken = parts[parts.length - 1].trim();
          const filtered = allTags.filter(tag => {
              const haystacks = [tag.value, tag.label].map(value => normalizeToken(value));
              return haystacks.some(value => value.includes(normalizeToken(currentToken)));
          });

          suggestions.innerHTML = '';
          if (!currentValue || !currentToken || filtered.length === 0) {
              suggestions.style.display = 'none';
              return;
          }

          suggestions.style.display = 'block';
          filtered.slice(0, 12).forEach(tag => {
              const item = document.createElement('li');
              item.className = 'list-group-item list-group-item-action';
              item.textContent = tag.label;
              item.addEventListener('mousedown', function (event) {
                  event.preventDefault();
                  const partsBefore = currentValue.split(',').slice(0, -1);
                  const nextValue = partsBefore.concat(toStoredTag(tag.value)).join(', ');
                  input.value = formatTags(nextValue);
                  input.focus();
                  renderSuggestions();
              });
              suggestions.appendChild(item);
          });
      };

      const syncValue = () => {
          renderSuggestions();
      };

      input.addEventListener('input', syncValue);
      input.addEventListener('focus', renderSuggestions);
      input.addEventListener('blur', function () {
          const normalized = formatTags(input.value);
          if (normalized !== input.value) {
              input.value = normalized;
          }
          setTimeout(function () {
              suggestions.style.display = 'none';
          }, 150);
      });

      syncValue();
  })();
  </script>
{% endblock %}
